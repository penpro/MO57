[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
FastReplication=True
InvalidTagCharacters="\"\',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; ==============================================================================
; MOFramework UI Layer Tags
; ==============================================================================
; These tags identify UI layers for the CommonUI widget stack system.
; Layers are Z-ordered: HUD (0) < Game (50) < GameOverlay (100) < Menu (150) < Modal (200)

+GameplayTagList=(Tag="MO.UI.Layer.HUD",DevComment="Always-visible HUD elements (reticle, mode indicator, tool hints)")
+GameplayTagList=(Tag="MO.UI.Layer.Game",DevComment="Switchable gameplay menus (inventory, crafting, skills, building)")
+GameplayTagList=(Tag="MO.UI.Layer.GameOverlay",DevComment="Overlays on gameplay menus (station context, harvest progress)")
+GameplayTagList=(Tag="MO.UI.Layer.Menu",DevComment="System menus (in-game menu, possession menu)")
+GameplayTagList=(Tag="MO.UI.Layer.Modal",DevComment="Modal dialogs and context menus (confirmation, item context)")

