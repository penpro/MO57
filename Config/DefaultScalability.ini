; MO57 graphics quality levels: the project's overrides on top of the engine's Engine/Config/BaseScalability.ini.
;
; The engine already ships a full Low / Medium / High / Epic set (shadows, Lumen, reflections, post, effects, shading...). What it does not know about is what MO57 spends its frame on, so this file only
; adds the MO-specific cuts, each measured on the packaged Development build (1080p, RTX 4090, seed 7, MO.Perf.Tour: avg fps in Rainforest / TemperateForest / Meadow; Tools/perf_experiments*.txt):
;
;     Epic (engine)        60 / 64 / 68      p95 19.6 / 17.5 / 17.0 ms   (the reference; what the project shipped with; unchanged by this file)
;     High  + this file    73 / 81 / 85      p95 16.2 / 14.5 / 13.8      (the engine's High alone: 69 / 78 / 81; the file adds Lumen software tracing + no hair ray tracing)
;     Medium + this file   80 / 90 / 93      p95 14.7 / 13.3 / 12.8
;     Low   + this file   121 / 129 / 122    p95 10.6 / 10.0 / 13.3      (no Lumen GI: flat lighting; the fixed GPU floor is ~5-7 ms)
;   Single factors against Epic in the Rainforest (59 fps): Lumen software tracing +2.6, hair ray tracing off +1.8, Nanite 2 px per edge +3.4, cheaper virtual shadow maps +7.7, hair strands off +6.5.
;
; RULES
;  1. The engine ONLY accepts cvars flagged ECVF_Scalability / ECVF_ScalabilityGroup in a scalability file: anything else trips an ensure that the COOK commandlet promotes to fatal ("Scalability.ini can
;     only set ECVF_Scalability console variables"). r.Nanite.MaxPixelsPerEdge and r.HairStrands.DeepShadow.Resolution are NOT flagged, so they cannot live here (a quality table in C++ would be needed).
;     MOFramework.Graphics.ScalabilityFile enforces the flag and that every cvar exists.
;  2. A cvar overridden at a lower level is ALSO pinned at Epic here: scalability only writes the cvars of the level being applied, so a cvar missing from [Group@3] would keep the lower level's value
;     after the player switches back up.

; --- Lumen: hardware ray tracing for GI and reflections is Epic-only (software tracing costs ~2-3 ms less and looks the same on terrain and foliage). ---
[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@1]
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@0]
r.Lumen.HardwareRayTracing=0

[ReflectionQuality@3]
r.Lumen.Reflections.HardwareRayTracing=1

[ReflectionQuality@2]
r.Lumen.Reflections.HardwareRayTracing=0

[ReflectionQuality@1]
r.Lumen.Reflections.HardwareRayTracing=0

[ReflectionQuality@0]
r.Lumen.Reflections.HardwareRayTracing=0

; --- Hair strands (the characters' hair): ray-traced hair shadows are Epic-only. ---
[ShadingQuality@3]
r.HairStrands.Raytracing=1

[ShadingQuality@2]
r.HairStrands.Raytracing=0

[ShadingQuality@1]
r.HairStrands.Raytracing=0

[ShadingQuality@0]
r.HairStrands.Raytracing=0

; --- Texture streaming pool (2026-10-12): the engine's Epic tier is a 1000 MB pool, which the world no longer fits (Megascans surfaces + 4K MetaHuman maps + the Electric Dreams assets): the log and the
; on-screen warning said "TEXTURE STREAMING POOL OVER BUDGET" and the streamer drops mips for everything (blurry, flat normals / roughness on skin and rocks). Sized for the card class each tier targets,
; and limited to the real VRAM so a smaller card never over-commits. ---
[TextureQuality@4]
r.Streaming.PoolSize=6000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=4000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=2000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@1]
r.Streaming.PoolSize=1000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@0]
r.Streaming.PoolSize=500
r.Streaming.LimitPoolSizeToVRAM=1
