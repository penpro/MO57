; =============================================================================
; Crash Reporter — paired with IncludeCrashReporter=True in DefaultGame.ini.
;
; The standard Unreal Crash Reporter exe ships alongside packaged builds and
; sends minidumps + callstacks plus the user-typed description back to a
; configured endpoint. We default to "ask the user" (CrashReportClient shows
; its dialog) and let them decide whether to send.
;
; To pipe to a custom endpoint, set DataRouterUrl to your collector.
; Leaving it empty falls back to Epic's public endpoint — only useful if
; you've coordinated with Epic, otherwise crashes go nowhere. For real
; ingestion plug in a Sentry / BugSplat / Backtrace URL here.
; =============================================================================
[CrashReportClient]
