[Audio]
; MO57 (Oct 16 2026): back to XAudio2, the Windows audio backend through UE 5.7. UE 5.8 made the new WASAPI backend the default
; (BaseWindowsEngine.ini) and documents this key as the supported fallback (5.8 release notes, "Audio": [Audio] AudioMixerModuleName).
; Why: an intermittent full-volume buzz (the last few ms on repeat), sometimes followed by total silence, in PIE and packaged builds since
; the 5.8 move. In 5.8.1's WASAPI render callback (FWasapiDefaultRenderStream::DeviceRenderCallback) a block the mixer declines to fill
; (device swap in flight, stream not Running) is released to Windows unwritten, so the device replays stale memory. XAudio2 queues
; buffers instead: a declined block starves the voice = silence, never a replay. Community 5.8 reports match ("pop then complete silence"
; in PIE, a 5.8.1 WASAPI-thread freeze said to be fixed in 5.8.2). To return to WASAPI, delete this key.
AudioMixerModuleName=AudioMixerXAudio2
